<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>推理机对话</title>
<h1>Python + Datalog 推理机对话</h1><p>面向编程题的事实与算法推理，不是通用聊天。模型翻译可能出错，请核对事实；不会执行生成代码或自动成长。</p>
<label>题目参数 <input id="signature" value="solve(nums)" maxlength="200"></label><p>例如 solve(nums) / solve(coins, target)。请在题面明确参数含义、规模和保证；更换参数前清空。</p>
<div id="history"></div><form id="form"><textarea id="message" rows="5" cols="70" maxlength="6000" placeholder="输入题目；后续可补充或修正条件" required></textarea><br><button id="send">发送</button><button id="reset" type="button">清空上下文</button></form><p id="status" role="status"></p><script src="/chat.js"></script></html>
